<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dream School</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .school-box {
            width: 80%;
            margin: auto;
            background-color: white;
            border: 4px solid #222;
            padding: 25px;
        }

        h1 {
            border: 3px solid #222;
            padding: 15px;
            margin-bottom: 20px;
        }

        .timing {
            border: 2px solid #222;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 2px solid #222;
            padding: 12px;
            text-align: center;
        }

        th {
            font-size: 18px;
        }

        .subjects {
            border: 3px solid #222;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="school-box">

        <h1>MY DREAM SCHOOL</h1>

        <div class="timing">
            <strong>School Timing:</strong>
            8:00 AM - 2:00 PM
        </div>

        <div class="subjects">
            <h2>Subjects</h2>

            <table>
                <tr>
                    <th>Period</th>
                    <th>Time</th>
                    <th>Subject</th>
                </tr>

                <tr>
                    <td>1st</td>
                    <td>8:00 - 8:45</td>
                    <td>Mathematics</td>
                </tr>

                <tr>
                    <td>2nd</td>
                    <td>8:45 - 9:30</td>
                    <td>Chemistry</td>
                </tr>

                <tr>
                    <td>3rd</td>
                    <td>9:30 - 10:15</td>
                    <td>Physics</td>
                </tr>

                <tr>
                    <td>4th</td>
                    <td>10:15 - 11:00</td>
                    <td>English</td>
                </tr>

                <tr>
                    <td>5th</td>
                    <td>11:00 - 11:45</td>
                    <td>Computer Science</td>
                </tr>
            </table>
        </div>

    </div>

</body>
</html>
