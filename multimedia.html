<!DOCTYPE html>
<html>
    <head>
        <title>Multimedia in html</title>
        <meta name="referrer" content="strict-origin-when-cross-origin">
    </head>
    <body>
        <h1>Multimedia</h1>
        <img src="https://i1.sndcdn.com/avatars-JUvAAPvAA86fmbVE-SH0i6g-t1080x1080.jpg" width="150" height="150" alt="Nasa logo">
        <br>
        <img src="images.jpg" width="350" height="350">
        
        <audio controls loop >
            <source src="123.mp3" type="audio/mpeg">
            Browser doesn't support Audio
        </audio>
        <br>
        <video controls width="650px" >
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
        <br>
        <iframe
        src="https://scratch.mit.edu/projects/60917032/embed"
        width="650px"
        height="500"
        allowtransperancy="true"
        allowfullscreen
        >
        </iframe>
        <br>
     <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/vzTIIyKRidk"
    title="YouTube video player"
    frameborder="0"
    allowfullscreen>
</iframe>
    </body>
</html>
